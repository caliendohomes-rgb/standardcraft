[build]
  command = "npm run build && npm run seed || echo '[seed] Skipped or failed — site still deploys'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/start-free"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/claim-your-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/get-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/sign-in"
  status = 301

[[redirects]]
  from = "/library"
  to = "/free-resource-library"
  status = 301
