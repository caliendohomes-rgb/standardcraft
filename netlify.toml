[build]
  command = "npm run build && npm run seed || echo '[seed] Skipped or failed — site still deploys'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Explicitly disabled: the legacy XSS auditor is deprecated and can create
    # cross-site info-leak vectors in old browsers. CSP is the real control.
    X-XSS-Protection = "0"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://plausible.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/start-free"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/claim-your-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/get-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/sign-in"
  status = 301

[[redirects]]
  from = "/library"
  to = "/free-resource-library"
  status = 301
