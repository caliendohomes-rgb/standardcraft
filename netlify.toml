[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/start-free"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/claim-your-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/get-free-resource"
  to = "/claim-free"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
